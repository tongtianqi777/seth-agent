[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seth-agent"
version = "0.1.0"
description = "Private agent that turns ingested WhatsApp messages into a structured calendar memory"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
seth-agent = "seth_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seth_agent.memory" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
